<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Bitap Unicode Delete Test</title>
<style>
html,body{margin:0;padding:0;background:#fff;font-family:sans-serif}
#wrap{padding:14px 12px}
h3{margin:0 0 6px;font-size:17px;color:#333}
#cases{margin:0 0 8px;font-size:14px;color:#555}
textarea{width:100%;height:140px;box-sizing:border-box;font-size:30px;line-height:1.5;padding:10px;border:2px solid #666;border-radius:8px;background:#fafafa;color:#000}
#status{font-size:13px;color:#333;margin-top:8px;font-family:monospace;white-space:pre-wrap;word-break:break-all}
</style></head>
<body><div id="wrap"><h3>Unicode Delete · <span id="caseName"></span></h3>
<div id="cases">family / skin / flag / accent / emoji / hanzi / selection</div>
<textarea id="main"></textarea>
<div id="status">len=0 sel=0-0 value=""</div>
<div style="margin-top:10px"><button id="clear">清空</button> <button id="selall">全选</button></div>
</div>
<script>
var CASES={
 family:{name:'家庭 emoji 👨‍👩‍👧‍👦', value:'👨‍👩‍👧‍👦', select:false},
 skin:{name:'肤色 👍🏽', value:'👍🏽', select:false},
 flag:{name:'国旗 🇨🇳', value:'🇨🇳', select:false},
 accent:{name:'组合重音 e+U+0301', value:'e\u0301', select:false},
 emoji:{name:'普通 emoji 😀', value:'😀', select:false},
 hanzi:{name:'汉字 汉字', value:'汉字', select:false},
 selection:{name:'选区 选中文本', value:'选中文本', select:true}
};
var t=document.getElementById('main'), s=document.getElementById('status');
function upd(){
  s.textContent='len='+t.value.length+' sel='+t.selectionStart+'-'+t.selectionEnd+' value='+JSON.stringify(t.value)+' cp='+Array.from(t.value).map(function(c){return c.codePointAt(0).toString(16)}).join(',');
}
function init(){
  var q=new URLSearchParams(location.search);
  var key=q.get('case')||'family';
  var c=CASES[key]||CASES.family;
  document.getElementById('caseName').textContent=c.name+' ('+key+')';
  t.value=c.value;
  if(c.select){t.setSelectionRange(0,t.value.length);}else{t.setSelectionRange(t.value.length,t.value.length);}
  upd();
}
document.getElementById('clear').addEventListener('click',function(){t.value='';t.focus();t.setSelectionRange(0,0);upd();});
document.getElementById('selall').addEventListener('click',function(){t.focus();t.setSelectionRange(0,t.value.length);upd();});
t.addEventListener('input',upd);t.addEventListener('select',upd);t.addEventListener('keyup',upd);t.addEventListener('click',upd);
t.addEventListener('selectionchange',upd);
window.addEventListener('load',init);
window.addEventListener('resize',upd);
</script></body></html>
