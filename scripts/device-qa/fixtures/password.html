<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Bitap Password Smoke</title>
<style>
html,body{margin:0;padding:0;background:#fff;font-family:sans-serif}
#wrap{padding:14px 12px}
h3{margin:0 0 8px;font-size:17px;color:#333}
input{width:100%;height:70px;box-sizing:border-box;font-size:26px;padding:10px;border:2px solid #666;border-radius:8px;background:#fafafa;color:#000;margin-bottom:10px}
#status{font-size:13px;color:#333;margin-top:8px;font-family:monospace;white-space:pre-wrap;word-break:break-all}
</style></head>
<body><div id="wrap"><h3>Bitap 密码框测试</h3>
<input id="pwd" type="password" placeholder="密码框（不应学习）" autofocus>
<div id="status">pwdLen=0</div>
<input id="normal" placeholder="普通输入框">
<div id="nstatus">normalLen=0</div>
</div>
<script>
var p=document.getElementById('pwd'), s=document.getElementById('status'), n=document.getElementById('normal'), ns=document.getElementById('nstatus');
function upd(){s.textContent='pwdLen='+p.value.length; ns.textContent='normalLen='+n.value.length;}
p.addEventListener('input',upd);n.addEventListener('input',upd);
p.addEventListener('selectionchange',upd);n.addEventListener('selectionchange',upd);
window.addEventListener('load',function(){p.focus();});
</script></body></html>
