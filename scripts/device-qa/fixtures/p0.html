<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Bitap P0 Keyboard Test</title>
<style>
html,body{margin:0;padding:0;background:#fff;font-family:sans-serif}
#wrap{padding:14px 12px}
h3{margin:0 0 8px;font-size:17px;color:#333}
textarea{width:100%;height:170px;box-sizing:border-box;font-size:26px;line-height:1.5;padding:10px;border:2px solid #666;border-radius:8px;background:#fafafa;color:#000}
#status{font-size:13px;color:#333;margin-top:8px;font-family:monospace;white-space:pre-wrap;word-break:break-all}
button{margin-top:8px;font-size:16px;padding:6px 14px}
</style></head>
<body><div id="wrap"><h3>Bitap P0 输入测试</h3>
<textarea id="main" placeholder="在此输入..."></textarea>
<div id="status">len=0 sel=0-0 value=""</div>
<div style="margin-top:10px"><button id="clear">清空</button> <button id="selall">全选</button></div>
</div>
<script>
var t=document.getElementById('main'), s=document.getElementById('status');
function esc(v){return v.replace(/[\uD800-\uDFFF]/g,function(c){return '\\u'+c.charCodeAt(0).toString(16);});}
function upd(){
  s.textContent='len='+t.value.length+' sel='+t.selectionStart+'-'+t.selectionEnd+' value='+JSON.stringify(t.value);
}
t.addEventListener('input',upd);t.addEventListener('select',upd);t.addEventListener('keyup',upd);t.addEventListener('click',upd);
t.addEventListener('selectionchange',upd);
window.addEventListener('load',function(){t.focus();t.setSelectionRange(t.value.length,t.value.length);upd();});
document.getElementById('clear').addEventListener('click',function(){t.value='';t.focus();t.setSelectionRange(0,0);upd();});
document.getElementById('selall').addEventListener('click',function(){t.focus();t.setSelectionRange(0,t.value.length);upd();});
window.addEventListener('resize',upd);
</script></body></html>
