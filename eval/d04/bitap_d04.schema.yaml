# Bitap D04 host experiment; not shipped in the APK.
# Spelling rules derived from rime/rime-pinyin-simp, Apache-2.0,
# commit 0c6861ef7420ee780270ca6d993d18d4101049d0.
# Changes: no reverse lookup, recognizer, punctuation, key bindings or presets;
# no learning, completion or plugins. Keeps script translation and abbreviations.
schema:
  schema_id: bitap_d04
  name: Bitap D04 isolated probe
  version: '1'
switches:
  - name: ascii_mode
    reset: 0
engine:
  processors: [speller, selector, express_editor]
  segmentors: [abc_segmentor, fallback_segmentor]
  translators: [script_translator]
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^hm$/
    - erase/^m$/
    - erase/^n$/
    - erase/^ng$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/
translator:
  dictionary: pinyin_simp
  enable_user_dict: false
  enable_learning: false
  enable_completion: false
menu:
  page_size: 8
